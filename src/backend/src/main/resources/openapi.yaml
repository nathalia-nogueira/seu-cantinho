components:
    parameters:
        IdParam:
            name: id
            in: path
            required: true
            schema:
                type: integer
                format: int64

    schemas:
        Endereco:
            type: object
            properties:
                id:
                    type: integer
                    format: int64
                estado:
                    type: string
                cidade:
                    type: string
                rua:
                    type: string
                numero:
                    type: integer

        Cliente:
            type: object
            properties:
                id:
                    type: integer
                    format: int64
                cpf:
                    type: string
                nome:
                    type: string
                email:
                    type: string
                telefone:
                    type: string

        Administrador:
            type: object
            properties:
                id:
                    type: integer
                    format: int64
                cpf:
                    type: string
                nome:
                    type: string
                email:
                    type: string
                telefone:
                    type: string
                filial:
                    $ref: '#/components/schemas/Filial'

        Filial:
            type: object
            properties:
                id:
                    type: integer
                    format: int64
                nome:
                    type: string
                endereco:
                    $ref: '#/components/schemas/Endereco'

        Espaco:
            type: object
            properties:
                id:
                    type: integer
                    format: int64
                nome:
                    type: string
                descricao:
                    type: string
                fotos:
                    type: array
                    items:
                        type: string
                capacidade:
                    type: integer
                    format: int64
                precoDiaria:
                    type: number
                    format: double
                endereco:
                    $ref: '#/components/schemas/Endereco'
                filial:
                    $ref: '#/components/schemas/Filial'

        Reserva:
            type: object
            properties:
                id:
                    type: integer
                    format: int64
                dataHoraInicio:
                    type: string
                    format: date-time
                dataHoraFim:
                    type: string
                    format: date-time
                sinal:
                    type: number
                    format: double
                valorTotal:
                    type: number
                    format: double
                statusReserva:
                    type: string
                statusPagamento:
                    type: string
                cliente:
                    $ref: '#/components/schemas/Cliente'
                espaco:
                    $ref: '#/components/schemas/Espaco'

        Pagamento:
            type: object
            properties:
                id:
                    type: integer
                    format: int64
                valor:
                    type: number
                    format: double
                data:
                    type: string
                    format: date-time
                reserva:
                    $ref: '#/components/schemas/Reserva'