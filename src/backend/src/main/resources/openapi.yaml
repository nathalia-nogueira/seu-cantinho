openapi: 3.0.3
info:
    title: API - Seu Cantinho
    description: Documentação dos endpoints da API Seu Cantinho
    version: 1.0.0

servers:
    - url: http://localhost:8080
      description: Servidor local

tags:
    - name: Clientes
      description: Gerenciamento de clientes
    - name: Espaços
      description: Gerenciamento de espaços
    - name: Reservas
      description: Gerenciamento de reservas
    - name: Filiais
      description: Gerenciamento de filiais
    - name: Endereços
      description: Gerenciamento de endereços
    - name: Pagamentos
      description: Gerenciamento de pagamentos
    - name: Administradores
      description: Gerenciamento de administradores

paths:
    /clientes:
        get:
            tags: [Clientes]
            summary: Lista todos os clientes
            responses:
                '200':
                    description: Sucesso
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/Cliente'
        post:
            tags: [Clientes]
            summary: Cria um novo cliente
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Cliente'
            responses:
                '201':
                    description: Criado
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Cliente'

    /clientes/{id}:
        get:
            tags: [Clientes]
            summary: Busca cliente por ID
            parameters:
                - $ref: '#/components/parameters/IdParam'
            responses:
                '200':
                    description: Encontrado
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Cliente'
                '404':
                    description: Não encontrado
        put:
            tags: [Clientes]
            summary: Atualiza cliente
            parameters:
                - $ref: '#/components/parameters/IdParam'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Cliente'
            responses:
                '200':
                    description: Atualizado
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Cliente'
        delete:
            tags: [Clientes]
            summary: Remove cliente
            parameters:
                - $ref: '#/components/parameters/IdParam'
            responses:
                '204':
                    description: Removido

